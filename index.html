<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOX — Standalone</title>
<style>
  :root {
    --bg: #050505;
    --panel: #0a0a0a;
    --panel-2: #0d0d0d;
    --border-1: #1b1b1b;
    --border-2: #232323;
    --accent: #b51f1f;
    --accent-bright: #d13030;
    --accent-dim: #6b1c1c;
    --ok: #3aa35a;
    --warn: #b58a1f;
    --off: #4a4a4a;
    --text-0: #f5f5f5;
    --text-1: #d8d8d8;
    --text-2: #999;
    --text-3: #6e6e6e;
    --text-4: #4a4a4a;
    --mono: "SF Mono", "Menlo", "Consolas", ui-monospace, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    color: var(--text-1);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  /* ===== BOOT ===== */
  #boot {
    position: fixed; inset: 0; background: #000; z-index: 999;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    padding: 8vw; font-family: var(--mono); color: var(--text-2); font-size: 12px;
    transition: opacity 0.6s ease;
  }
  #boot .brand-boot { color: var(--text-0); font-size: 15vw; font-weight: 900; letter-spacing: 4px; margin-bottom: 24px; line-height: 1; }
  #boot .line { opacity: 0; transform: translateY(4px); transition: opacity 0.3s, transform 0.3s; margin-bottom: 6px; }
  #boot .line.show { opacity: 1; transform: translateY(0); }
  #boot .line .ok { color: var(--ok); }
  #boot.hidden { opacity: 0; pointer-events: none; }
  @media (min-width: 700px) { #boot .brand-boot { font-size: 80px; } }

  /* ===== SHELL ===== */
  #shell { display: flex; min-height: 100vh; min-height: 100dvh; }

  /* Sidebar (desktop) / drawer (mobile) */
  #sidebar {
    position: fixed; top: 0; bottom: 0; left: 0; width: 250px;
    background: #030303; border-right: 1px solid var(--border-1);
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0;
    transform: translateX(-100%); transition: transform 0.25s ease;
    z-index: 200; display: flex; flex-direction: column;
  }
  #sidebar.open { transform: translateX(0); }
  .sb-brand { padding: 26px 22px 18px; border-bottom: 1px solid var(--border-1); }
  .sb-brand-text { color: var(--text-0); font-size: 22px; font-weight: 900; letter-spacing: 6px; }
  .sb-brand-sub { color: var(--text-4); font-size: 8px; letter-spacing: 2px; margin-top: 4px; }
  .sb-nav { flex: 1; overflow-y: auto; padding: 10px 0; }
  .sb-item {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    background: none; border: none; color: var(--text-2); font-family: var(--mono);
    font-size: 11px; letter-spacing: 1.5px; text-align: left; padding: 12px 22px; cursor: pointer;
  }
  .sb-item .dot { width: 5px; height: 5px; border-radius: 3px; background: var(--off); flex-shrink: 0; margin-left: 8px; }
  .sb-item.active { color: var(--text-0); background: #0d0d0d; border-left: 2px solid var(--accent); }
  .sb-item.active .dot { background: var(--accent-bright); }
  .sb-foot { padding: 16px 22px; border-top: 1px solid var(--border-1); font-family: var(--mono); font-size: 8px; color: var(--text-4); letter-spacing: 1px; }

  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  #scrim.show { opacity: 1; pointer-events: auto; }

  /* Header */
  #topbar {
    position: sticky; top: 0; z-index: 100; height: 60px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; padding-top: env(safe-area-inset-top, 0px);
    background: rgba(5,5,5,0.9); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border-1);
  }
  #menu-btn { background: none; border: 1px solid var(--border-2); color: var(--text-1); width: 36px; height: 36px; font-size: 15px; cursor: pointer; }
  .tb-title { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--text-2); }
  .tb-status { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 8px; letter-spacing: 1px; color: var(--text-3); }
  .tb-dot { width: 6px; height: 6px; border-radius: 3px; background: var(--off); }

  #main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  main { flex: 1; }
  .content-inner { max-width: 780px; margin: 0 auto; padding: 26px 18px 60px; }

  .screen { display: none; }
  .screen.active { display: block; animation: fadein 0.25s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .eyebrow { color: var(--accent-bright); font-family: var(--mono); font-size: 9px; letter-spacing: 2.5px; font-weight: 700; }
  h1.page-title { color: var(--text-0); font-size: 30px; font-weight: 900; letter-spacing: -0.5px; margin: 10px 0 12px; line-height: 1.1; }
  p.lede { color: var(--text-3); font-size: 13px; line-height: 20px; max-width: 480px; margin: 0 0 22px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
  @media (min-width: 560px) { .grid.g3 { grid-template-columns: repeat(3, 1fr); } }

  .stat {
    border: 1px solid var(--border-2); background: var(--panel); padding: 13px;
  }
  .stat-label { color: var(--text-4); font-family: var(--mono); font-size: 8px; letter-spacing: 1.5px; }
  .stat-value { color: var(--text-1); font-size: 12px; font-weight: 800; letter-spacing: 0.5px; margin-top: 7px; display: flex; align-items: center; gap: 6px; }

  .status-dot { width: 6px; height: 6px; border-radius: 3px; flex-shrink: 0; }
  .status-dot.on { background: var(--ok); }
  .status-dot.off { background: var(--off); }
  .status-dot.warn { background: var(--warn); }
  .status-dot.live { background: var(--accent-bright); }

  .panel { border: 1px solid var(--border-2); background: var(--panel); padding: 16px; margin-bottom: 14px; }
  .panel-label { color: var(--accent-dim); font-family: var(--mono); font-size: 8px; letter-spacing: 2px; font-weight: 800; margin-bottom: 12px; }
  .body-text { color: var(--text-3); font-size: 12.5px; line-height: 20px; margin: 0 0 10px; }
  .body-text:last-child { margin-bottom: 0; }

  textarea.command-input {
    width: 100%; min-height: 90px; color: var(--text-0); font-size: 14px; line-height: 21px;
    background: transparent; border: none; outline: none; resize: none; font-family: inherit; padding: 0;
  }
  textarea.command-input::placeholder { color: var(--text-4); }
  .execute-btn {
    height: 46px; width: 100%; background: var(--accent); border: none; color: #fff;
    display: flex; align-items: center; justify-content: space-between; padding: 0 14px;
    margin-top: 10px; cursor: pointer; font-family: var(--mono); letter-spacing: 1.5px; font-size: 10px; font-weight: 900;
  }
  .execute-btn:active { opacity: 0.8; }

  .activity-row { display: flex; margin-bottom: 10px; font-family: var(--mono); }
  .activity-prefix { width: 40px; flex-shrink: 0; color: var(--accent); font-size: 9px; font-weight: 900; }
  .activity-text { flex: 1; color: var(--text-3); font-size: 11px; line-height: 17px; }

  /* Pipeline (Intelligence) */
  .pipeline { display: flex; flex-direction: column; }
  .pipe-stage {
    border: 1px solid var(--border-2); background: var(--panel); padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px;
  }
  .pipe-arrow { color: var(--text-4); font-family: var(--mono); font-size: 11px; text-align: center; padding: 3px 0; }
  .pipe-name { color: var(--text-1); font-size: 11px; font-weight: 800; letter-spacing: 1px; font-family: var(--mono); }
  .pipe-tag { font-family: var(--mono); font-size: 8px; letter-spacing: 1px; padding: 3px 7px; border: 1px solid var(--border-2); color: var(--text-3); display: flex; align-items: center; gap: 5px; }

  /* Cards (agents / software / research / media) */
  .row-card {
    border: 1px solid var(--border-2); background: var(--panel); padding: 13px 14px;
    display: flex; align-items: center; margin-bottom: 8px; gap: 12px;
  }
  .row-idx { width: 26px; flex-shrink: 0; color: var(--accent-dim); font-family: var(--mono); font-size: 10px; font-weight: 900; }
  .row-body { flex: 1; min-width: 0; }
  .row-title { color: var(--text-1); font-size: 12px; font-weight: 800; letter-spacing: 0.5px; }
  .row-sub { color: var(--text-4); font-size: 10px; margin-top: 3px; }
  .row-tag { font-family: var(--mono); font-size: 8px; letter-spacing: 1px; padding: 3px 7px; border: 1px solid var(--border-2); white-space: nowrap; display: flex; align-items: center; gap: 5px; color: var(--text-3); }

  /* Memory cards */
  .memory-card {
    border-left: 2px solid var(--accent-dim); background: var(--panel);
    border-top: 1px solid var(--border-1); border-right: 1px solid var(--border-1); border-bottom: 1px solid var(--border-1);
    padding: 14px; margin-bottom: 8px;
  }
  .memory-title { color: var(--text-2); font-family: var(--mono); font-size: 9px; font-weight: 900; letter-spacing: 1.5px; }
  .memory-value { color: var(--text-3); font-size: 12px; line-height: 18px; margin-top: 7px; }

  /* System rows */
  .system-row { min-height: 46px; border-bottom: 1px solid var(--border-1); display: flex; align-items: center; justify-content: space-between; }
  .system-row:last-child { border-bottom: none; }
  .system-label { color: var(--text-2); font-family: var(--mono); font-size: 10px; letter-spacing: 1px; }
  .system-right { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 9px; color: var(--text-3); letter-spacing: 1px; }

  /* Crypto */
  .coin-card {
    border: 1px solid var(--border-2); background: var(--panel); min-height: 62px;
    padding: 0 14px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;
  }
  .coin-left { display: flex; align-items: center; gap: 11px; }
  .coin-mark { width: 30px; height: 30px; border: 1px solid var(--border-2); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: var(--text-2); flex-shrink: 0; }
  .coin-name { color: var(--text-1); font-size: 11px; font-weight: 800; letter-spacing: 0.5px; }
  .coin-symbol { color: var(--text-4); font-size: 9px; margin-top: 3px; font-family: var(--mono); }
  .coin-right { text-align: right; font-family: var(--mono); }
  .coin-price { color: var(--text-4); font-size: 12px; font-weight: 800; }
  .coin-feed { color: var(--off); font-size: 8px; margin-top: 3px; letter-spacing: 1px; }

  @media (min-width: 900px) {
    #sidebar { transform: translateX(0); position: sticky; }
    #scrim { display: none; }
    #menu-btn { display: none; }
    .content-inner { padding: 40px 40px 70px; max-width: 860px; }
  }
</style>
</head>
<body>

<div id="boot">
  <div class="brand-boot">NOX</div>
  <div id="boot-lines"></div>
</div>

<div id="shell">
  <div id="scrim"></div>

  <aside id="sidebar">
    <div class="sb-brand">
      <div class="sb-brand-text">NOX</div>
      <div class="sb-brand-sub">SYSTEM v0.1</div>
    </div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <button id="settings-btn" style="margin:0 22px 14px; background:none; border:1px solid var(--border-2); color:var(--text-2); font-family:var(--mono); font-size:9px; letter-spacing:1px; padding:8px 10px; cursor:pointer; text-align:left;">⚙ SETTINGS — AI KEY</button>
    <div class="sb-foot">BUILD A MACHINE, NOT A JOB.</div>
  </aside>

  <div id="settings-modal" style="display:none; position:fixed; inset:0; z-index:300; background:rgba(0,0,0,0.7); align-items:center; justify-content:center; padding:20px;">
    <div style="background:#0a0a0a; border:1px solid var(--border-2); max-width:420px; width:100%; padding:20px;">
      <div class="panel-label" style="margin-bottom:6px;">NOX AI ENGINE — GROQ KEY</div>
      <p class="body-text">Free, no card required. Get one at <span style="color:var(--text-2);">console.groq.com/keys</span>, paste it below. It's stored only in this browser (localStorage), never sent anywhere but Groq.</p>
      <input id="groq-key-input" type="password" placeholder="gsk_..." style="width:100%; background:#000; border:1px solid var(--border-2); color:var(--text-0); font-family:var(--mono); font-size:12px; padding:10px; margin:10px 0;">
      <div style="display:flex; gap:8px;">
        <button id="groq-key-save" class="execute-btn" style="margin-top:0;"><span>SAVE</span><span>→</span></button>
        <button id="groq-key-close" style="background:none; border:1px solid var(--border-2); color:var(--text-3); font-family:var(--mono); font-size:10px; padding:0 14px;">CLOSE</button>
      </div>
    </div>
  </div>

  <div id="main-col">
    <header id="topbar">
      <button id="menu-btn" aria-label="menu">☰</button>
      <div class="tb-title" id="tb-title">COMMAND</div>
      <div class="tb-status"><div class="tb-dot"></div>SYSTEM LOCAL</div>
    </header>

    <main>
      <div class="content-inner" id="content-inner">
        <!-- Screens injected by JS -->
      </div>
    </main>
  </div>
</div>

<script>
(function () {
  const SECTIONS = [
    { id: "command", label: "COMMAND" },
    { id: "intelligence", label: "INTELLIGENCE" },
    { id: "agents", label: "AGENTS" },
    { id: "software", label: "SOFTWARE" },
    { id: "hardware", label: "HARDWARE" },
    { id: "crypto", label: "CRYPTO" },
    { id: "research", label: "RESEARCH" },
    { id: "agency", label: "AGENCY" },
    { id: "media", label: "MEDIA" },
    { id: "memory", label: "MEMORY" },
    { id: "system", label: "SYSTEM" }
  ];

  const STATUS_DOT = { on: "on", off: "off", warn: "warn", live: "live" };

  function tag(text, status) {
    return '<span class="pipe-tag"><span class="status-dot ' + status + '"></span>' + text + '</span>';
  }
  function rowTag(text, status) {
    return '<span class="row-tag"><span class="status-dot ' + status + '"></span>' + text + '</span>';
  }

  // ---------- SCREEN CONTENT ----------

  function screenCommand() {
    return '' +
      '<div class="eyebrow">SHU / REQUIEM // 01</div>' +
      '<h1 class="page-title">YOUR COMMAND.<br>NOX EXECUTES.</h1>' +
      '<p class="lede">A technology ecosystem — AI, software, hardware, crypto, research, media — built around one operator.</p>' +

      '<div class="grid g3">' +
        statCard("AI ENGINE", "ONLINE", "on") +
        statCard("AGENCY", "ACTIVE", "on") +
        statCard("SOFTWARE", "IN DEV", "warn") +
        statCard("HARDWARE", "NOT CONNECTED", "off") +
        statCard("CRYPTO FEED", "ONLINE — CRYPTO.COM", "on") +
        statCard("MEMORY", "ONLINE — PERSISTENT", "on") +
      '</div>' +

      '<div class="panel">' +
        '<div class="panel-label">DIRECTIVE <span id="engine-pill" style="float:right;"></span></div>' +
        '<textarea class="command-input" id="command-input" placeholder="Tell NOX what to do..."></textarea>' +
        '<button class="execute-btn" id="execute-btn"><span id="execute-label">EXECUTE DIRECTIVE</span><span>→</span></button>' +
      '</div>' +

      '<div class="panel">' +
        '<div class="panel-label">ACTIVITY LOG <span style="color:var(--text-4); font-weight:400;">— synced via NOX memory</span></div>' +
        '<div id="activity-log"></div>' +
      '</div>';
  }

  function statCard(label, value, status) {
    return '<div class="stat"><div class="stat-label">' + label + '</div>' +
      '<div class="stat-value"><span class="status-dot ' + status + '"></span>' + value + '</div></div>';
  }

  function screenIntelligence() {
    const stages = [
      ["INTERFACE", "on", "ONLINE"],
      ["ORCHESTRATOR", "on", "ONLINE"],
      ["PLANNER", "on", "ONLINE"],
      ["RESEARCHER / CODER / REVIEWER", "on", "ONLINE — REASONING ONLY"],
      ["TOOLS", "off", "NOT CONNECTED"],
      ["RUNTIME", "off", "NOT CONNECTED"],
      ["MEMORY", "on", "ONLINE — PERSISTENT"]
    ];
    let pipeline = '<div class="pipeline">';
    stages.forEach(function (s, i) {
      pipeline += '<div class="pipe-stage"><span class="pipe-name">' + s[0] + '</span>' + tag(s[2], s[1]) + '</div>';
      if (i < stages.length - 1) pipeline += '<div class="pipe-arrow">↓</div>';
    });
    pipeline += '</div>';

    return '' +
      '<div class="eyebrow">THE JARVIS LAYER</div>' +
      '<h1 class="page-title">NOX INTELLIGENCE</h1>' +
      '<p class="lede">Interface, orchestration and reasoning genuinely run now — real model calls, backed by persistent memory. TOOLS and RUNTIME (repo access, command execution) are the two stages nothing fakes yet, because a hosted page can\'t do either.</p>' +
      pipeline +
      '<div class="panel" style="margin-top:16px;">' +
        '<div class="panel-label">MODEL LAYER</div>' +
        '<p class="body-text">Provider-agnostic by design. Local models, self-hosted inference, or remote APIs can sit behind this layer interchangeably — nothing is hard-coded to one vendor.</p>' +
      '</div>';
  }

  const AGENT_DEFS = [
    ["ORCHESTRATOR", "Task routing between agents", "You are ORCHESTRATOR, the routing layer of NOX. Given a directive, decide in 2-3 sentences which of PLANNER, RESEARCHER, CODER or REVIEWER should handle it and why. Be terse and technical."],
    ["PLANNER", "Breaks directives into steps", "You are PLANNER inside NOX. Break the given directive into a short numbered list of concrete steps (max 5). Be terse and technical, no preamble."],
    ["RESEARCHER", "Technical investigation", "You are RESEARCHER inside NOX. Give a short, technically grounded briefing (3-4 sentences) on the given topic or directive. No fluff."],
    ["CODER", "Drafts code, no execution yet", "You are CODER inside NOX. Produce a short, correct code sketch or snippet addressing the directive. Note in one line what would need real execution to verify it. Be terse."],
    ["REVIEWER", "Critiques before anything ships", "You are REVIEWER inside NOX. Given the directive, list up to 3 concrete risks or gaps a builder should check before shipping it. Terse, no fluff."]
  ];

  function screenAgents() {
    let out = '<div class="eyebrow">NOX AGENT NETWORK</div><h1 class="page-title">FIVE ROLES.<br>ONE SYSTEM.</h1>' +
      '<p class="lede">Each role below genuinely runs on the NOX intelligence layer — real model calls, not scripted text. What none of them can do yet: touch a filesystem, run a command, or open a pull request. That needs a real execution runtime, not a hosted page.</p>' +
      '<div class="panel">' +
        '<div class="panel-label">DIRECTIVE FOR AGENTS</div>' +
        '<textarea class="command-input" id="agent-input" style="min-height:60px;" placeholder="Give the agent network something to work on..."></textarea>' +
      '</div>';
    AGENT_DEFS.forEach(function (a, i) {
      out += '<div class="row-card" style="align-items:flex-start; flex-direction:column; gap:8px;">' +
        '<div style="display:flex; align-items:center; justify-content:space-between; width:100%;">' +
        '<div style="display:flex; align-items:center; gap:12px;"><div class="row-idx">0' + (i + 1) + '</div>' +
        '<div class="row-body"><div class="row-title">' + a[0] + '</div><div class="row-sub">' + a[1] + '</div></div></div>' +
        '<div style="display:flex; align-items:center; gap:8px;">' + rowTag("ONLINE", "on") +
        '<button class="agent-run" data-agent="' + i + '" style="background:none; border:1px solid var(--border-2); color:var(--text-2); font-family:var(--mono); font-size:9px; letter-spacing:1px; padding:6px 10px; cursor:pointer;">RUN</button></div>' +
        '</div>' +
        '<div class="agent-output" id="agent-output-' + i + '" style="display:none; width:100%; border-top:1px solid var(--border-1); padding-top:8px; color:var(--text-3); font-size:11.5px; line-height:18px; white-space:pre-wrap;"></div>' +
        '</div>';
    });
    out += '<div class="panel" style="margin-top:6px;"><div class="panel-label">EXECUTION MODEL</div>' +
      '<p class="body-text">Every role above calls the same NOX intelligence layer with a distinct persona — that\'s genuinely live, on-demand. There\'s no autonomous loop, no shared memory between them yet, and no ability to actually execute what they propose. That\'s the honest current boundary, not a permissions setting waiting to be flipped.</p></div>';
    return out;
  }

  function wireAgents() {
    const input = document.getElementById("agent-input");
    document.querySelectorAll(".agent-run").forEach(function (btn) {
      if (btn.dataset.wired) return;
      btn.dataset.wired = "1";
      btn.addEventListener("click", async function () {
        const idx = Number(btn.dataset.agent);
        const def = AGENT_DEFS[idx];
        const directive = (input && input.value.trim()) || "Give a general status readout for NOX.";
        const outEl = document.getElementById("agent-output-" + idx);
        outEl.style.display = "block";
        outEl.textContent = "…";
        btn.disabled = true;
        try {
          const res = await askNox(def[2] + "\n\nDirective: " + directive);
          outEl.textContent = res;
        } catch (e) {
          outEl.textContent = "AGENT UNAVAILABLE: " + (e && e.message ? e.message : "sample capability not granted in this view.");
        }
        btn.disabled = false;
      });
    });
  }

  function screenSoftware() {
    const items = [
      ["NOX SENTINEL", "Cybersecurity SaaS, Nox Systems", "BACK BURNER", "warn"],
      ["NOX OS", "Experimental operating layer", "CONCEPT", "off"],
      ["COMPASSIONEX", "Nox Systems product line", "CONCEPT", "off"]
    ];
    let out = '<div class="eyebrow">EXPERIMENTAL BUILDS</div><h1 class="page-title">NOX SOFTWARE</h1>' +
      '<p class="lede">Applications, tools, agents and platforms built inside the NOX ecosystem. Status is tracked honestly, not marketed.</p>';
    items.forEach(function (a) {
      out += '<div class="row-card"><div class="row-body"><div class="row-title">' + a[0] + '</div><div class="row-sub">' + a[1] + '</div></div>' +
        rowTag(a[2], a[3]) + '</div>';
    });
    return out;
  }

  function screenHardware() {
    return '<div class="eyebrow">THE PHYSICAL LAB</div><h1 class="page-title">NOX HARDWARE</h1>' +
      '<p class="lede">PCs, servers, networking, AI hardware, Linux machines, SBCs, robotics. Nothing is connected to this interface yet.</p>' +
      '<div class="grid">' +
        statCard("LAB TELEMETRY", "NOT CONNECTED", "off") +
        statCard("DEVICE REGISTRY", "EMPTY", "off") +
      '</div>' +
      '<div class="panel"><div class="panel-label">STATUS</div><p class="body-text">No hardware has been wired into NOX. This section will populate as real devices come online — never before.</p></div>';
  }

  function screenCrypto() {
    const coins = [
      ["BITCOIN", "BTC", "BTC_USD"], ["ETHEREUM", "ETH", "ETH_USD"], ["SOLANA", "SOL", "SOL_USD"],
      ["XRP", "XRP", "XRP_USD"], ["DOGECOIN", "DOGE", "DOGE_USD"], ["CARDANO", "ADA", "ADA_USD"]
    ];
    let list = '';
    coins.forEach(function (c) {
      list += '<div class="coin-card" id="coin-' + c[2] + '"><div class="coin-left">' +
        '<div class="coin-mark">' + c[1][0] + '</div>' +
        '<div><div class="coin-name">' + c[0] + '</div><div class="coin-symbol">' + c[2].replace("_", "/") + '</div></div></div>' +
        '<div class="coin-right"><div class="coin-price" data-price>--</div><div class="coin-feed" data-feed>CONNECTING…</div></div></div>';
    });
    return '<div class="eyebrow">TECHNICAL, NOT TRADING-FLOOR</div><h1 class="page-title">NOX CRYPTO</h1>' +
      '<p class="lede">Bitcoin, cryptography, blockchain architecture, on-chain research — not price-chasing.</p>' +
      '<div class="panel" style="margin-bottom:16px;"><div class="panel-label">LIVE FEED — CRYPTO.COM, FREE, NO KEY</div>' +
      '<p class="body-text" id="crypto-feed-note">Reading real exchange tickers directly from Crypto.com\'s public API.</p></div>' +
      list;
  }

  const CRYPTO_INSTRUMENTS = ["BTC_USD", "ETH_USD", "SOL_USD", "XRP_USD", "DOGE_USD", "ADA_USD"];
  let cryptoPollTimer = null;

  function formatCoinPrice(value) {
    const n = Number(value);
    if (!isFinite(n)) return "--";
    if (n >= 1000) return "$" + n.toLocaleString(undefined, { maximumFractionDigits: 2 });
    if (n >= 1) return "$" + n.toLocaleString(undefined, { maximumFractionDigits: 4 });
    return "$" + n.toLocaleString(undefined, { maximumFractionDigits: 6 });
  }

  // Crypto.com's public REST ticker (no key, no auth). Handles both the
  // friendly field names and the exchange's abbreviated wire format,
  // since public docs show both depending on endpoint version.
  function normalizeTicker(raw) {
    if (!raw) return null;
    return {
      last: raw.last !== undefined ? raw.last : raw.a,
      change: raw.change !== undefined ? raw.change : (raw.priceChange !== undefined ? raw.priceChange : raw.c)
    };
  }

  async function fetchTicker(inst) {
    const url = "https://api.crypto.com/exchange/v1/public/get-ticker?instrument_name=" + inst;
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    const result = json && json.result ? json.result : json;
    let raw = result && result.data ? result.data : result;
    if (Array.isArray(raw)) raw = raw[0];
    return normalizeTicker(raw);
  }

  async function pollCrypto() {
    const noteEl = document.getElementById("crypto-feed-note");
    let anySuccess = false;
    for (const inst of CRYPTO_INSTRUMENTS) {
      const card = document.getElementById("coin-" + inst);
      if (!card) continue;
      try {
        const data = await fetchTicker(inst);
        const priceEl = card.querySelector("[data-price]");
        const feedEl = card.querySelector("[data-feed]");
        if (data && data.last !== undefined) {
          anySuccess = true;
          priceEl.textContent = formatCoinPrice(data.last);
          const chg = Number(data.change);
          const chgPct = isFinite(chg) ? (Math.abs(chg) <= 1 ? chg * 100 : chg) : NaN;
          feedEl.textContent = isFinite(chgPct) ? ((chgPct >= 0 ? "+" : "") + chgPct.toFixed(2) + "% · LIVE") : "LIVE";
          feedEl.style.color = isFinite(chgPct) && chgPct < 0 ? "#d55" : "var(--ok)";
        } else {
          card.querySelector("[data-feed]").textContent = "NO DATA";
        }
      } catch (e) {
        const feedEl = card.querySelector("[data-feed]");
        if (feedEl) feedEl.textContent = "FEED ERROR";
      }
    }
    if (noteEl) {
      noteEl.textContent = anySuccess
        ? "Reading real exchange tickers directly from Crypto.com's public API — free, no key, refreshes every 20s."
        : "Couldn't reach Crypto.com's public API from this browser right now — will keep retrying.";
    }
  }

  function wireCrypto() {
    pollCrypto();
    if (cryptoPollTimer) clearInterval(cryptoPollTimer);
    cryptoPollTimer = setInterval(pollCrypto, 20000);
  }

  function screenResearch() {
    const items = [
      ["AI AGENT ARCHITECTURE", "Orchestrator/planner design patterns", "OPEN", "warn"],
      ["OPERATING SYSTEMS", "Linux internals, sandboxing", "OPEN", "warn"],
      ["CRYPTOGRAPHY", "Protocol-level, not trading", "IDLE", "off"],
      ["CYBERSECURITY", "Authorised environments only", "IDLE", "off"]
    ];
    let out = '<div class="eyebrow">THE RABBIT-HOLE DEPARTMENT</div><h1 class="page-title">NOX RESEARCH</h1>' +
      '<p class="lede">AI, cybersecurity, OS internals, cryptography, robotics — whatever\'s interesting enough to chase.</p>';
    items.forEach(function (a) {
      out += '<div class="row-card"><div class="row-body"><div class="row-title">' + a[0] + '</div><div class="row-sub">' + a[1] + '</div></div>' +
        rowTag(a[2], a[3]) + '</div>';
    });
    return out;
  }

  function screenAgency() {
    return '<div class="eyebrow">THE CASH ENGINE</div><h1 class="page-title">NOX AGENCY</h1>' +
      '<p class="lede">Web design, web development, technical implementation — funding the wider ecosystem while AI makes the work faster internally.</p>' +
      '<div class="grid">' + statCard("STATUS", "ACTIVE", "on") + statCard("FOCUS", "WEB DELIVERY", "on") + '</div>';
  }

  function screenMedia() {
    return '<div class="eyebrow">THE JOURNEY, NOT THE HIGHLIGHT REEL</div><h1 class="page-title">NOX MEDIA</h1>' +
      '<p class="lede">Documenting the build — experiments, wins, failures, projects — as it happens, not after it\'s "made it."</p>' +
      '<div class="panel"><div class="panel-label">LOG</div><p class="body-text">No entries published yet. This is where the record lives once there\'s something honest to say.</p></div>';
  }

  function screenMemory() {
    const cards = [
      ["NOX VISION", "A personal technological operating system — AI, software, hardware, crypto, research, media, business, unified under one identity."],
      ["DESIGN LANGUAGE", "Shu Kurenai / Spryzen Requiem translated into a serious interface. Black, graphite, chrome, controlled red. Never neon-cyberpunk."],
      ["OPERATING PRINCIPLE", "Build a machine, not a job. Online means online — nothing here claims a connection it doesn't have."],
      ["CURRENT STATE", "Interface, AI engine and persistent memory are live. Hardware and code execution are not — see SYSTEM."]
    ];
    let out = '<div class="eyebrow">PERSISTENT KNOWLEDGE — ONLINE</div><h1 class="page-title">NOX<br>REMEMBERS.</h1>' +
      '<p class="lede">Backed by real shared storage now, not a JS variable that resets on refresh. Directives from COMMAND persist here across sessions.</p>';
    cards.forEach(function (c) {
      out += '<div class="memory-card"><div class="memory-title">' + c[0] + '</div><div class="memory-value">' + c[1] + '</div></div>';
    });
    out += '<div class="panel"><div class="panel-label">DIRECTIVE HISTORY</div><div id="memory-log" style="color:var(--text-3); font-size:11.5px; line-height:18px;">Loading…</div></div>';
    return out;
  }

  function screenSystem() {
    const rows = [
      ["INTERFACE", "ONLINE", "on"],
      ["AI ENGINE", "ONLINE", "on"],
      ["AGENT RUNTIME", "ONLINE — REASONING ONLY", "on"],
      ["MEMORY", "ONLINE — PERSISTENT", "on"],
      ["CRYPTO FEED", "ONLINE — CRYPTO.COM", "on"],
      ["GIT", "NOT CONNECTED", "off"]
    ];
    let out = '<div class="eyebrow">DIAGNOSTICS</div><h1 class="page-title">NOX<br>STATUS.</h1>' +
      '<div class="panel">';
    rows.forEach(function (r) {
      out += '<div class="system-row"><div class="system-label">' + r[0] + '</div>' +
        '<div class="system-right"><span class="status-dot ' + r[2] + '"></span>' + r[1] + '</div></div>';
    });
    out += '</div>' +
      '<div class="panel"><div class="panel-label">WHY GIT ISN\'T ONLINE</div>' +
      '<p class="body-text">A hosted web page can\'t touch a repo or run commands by design, for any site, ever. That needs a real dev runtime — Claude Code is the actual tool for that job.</p></div>' +
      '<div class="panel"><div class="panel-label">ARCHITECTURE</div>' +
      '<p class="body-text">OPERATOR → NOX INTERFACE → ORCHESTRATOR → PLANNER → RESEARCHER / CODER / REVIEWER → TOOLS → RUNTIME → RESULT → MEMORY</p></div>';
    return out;
  }

  const RENDER = {
    command: screenCommand, intelligence: screenIntelligence, agents: screenAgents,
    software: screenSoftware, hardware: screenHardware, crypto: screenCrypto,
    research: screenResearch, agency: screenAgency, media: screenMedia,
    memory: screenMemory, system: screenSystem
  };

  // ---------- BUILD SIDEBAR ----------
  const sbNav = document.getElementById("sb-nav");
  SECTIONS.forEach(function (s, i) {
    const btn = document.createElement("button");
    btn.className = "sb-item" + (i === 0 ? " active" : "");
    btn.dataset.screen = s.id;
    btn.innerHTML = '<span>// 0' + (i + 1 < 10 ? "0" + (i + 1) : i + 1) + '  ' + s.label + '</span><span class="dot"></span>';
    btn.addEventListener("click", function () { goTo(s.id); closeDrawer(); });
    sbNav.appendChild(btn);
  });

  const contentInner = document.getElementById("content-inner");
  SECTIONS.forEach(function (s) {
    const div = document.createElement("div");
    div.className = "screen" + (s.id === "command" ? " active" : "");
    div.dataset.screen = s.id;
    div.innerHTML = RENDER[s.id]();
    contentInner.appendChild(div);
  });

  function goTo(id) {
    document.querySelectorAll(".screen").forEach(function (el) { el.classList.toggle("active", el.dataset.screen === id); });
    document.querySelectorAll(".sb-item").forEach(function (el) { el.classList.toggle("active", el.dataset.screen === id); });
    const s = SECTIONS.find(function (x) { return x.id === id; });
    document.getElementById("tb-title").textContent = s.label;
    document.getElementById("content-inner").scrollTop = 0;
    window.scrollTo(0, 0);
    if (id === "command") wireCommand();
    if (id === "agents") wireAgents();
    if (id === "memory") renderMemoryLog();
    if (id === "crypto") wireCrypto();
  }

  // ---------- DRAWER ----------
  const sidebar = document.getElementById("sidebar");
  const scrim = document.getElementById("scrim");
  document.getElementById("menu-btn").addEventListener("click", function () {
    sidebar.classList.add("open"); scrim.classList.add("show");
  });
  scrim.addEventListener("click", closeDrawer);
  function closeDrawer() { sidebar.classList.remove("open"); scrim.classList.remove("show"); }

  // ---------- SETTINGS (Groq API key, free tier, stored locally only) ----------
  const GROQ_KEY_STORAGE = "nox_groq_key";
  function getGroqKey() { return localStorage.getItem(GROQ_KEY_STORAGE) || ""; }
  function setGroqKey(k) { localStorage.setItem(GROQ_KEY_STORAGE, k); }

  const settingsModal = document.getElementById("settings-modal");
  document.getElementById("settings-btn").addEventListener("click", function () {
    document.getElementById("groq-key-input").value = getGroqKey();
    settingsModal.style.display = "flex";
  });
  document.getElementById("groq-key-close").addEventListener("click", function () { settingsModal.style.display = "none"; });
  document.getElementById("groq-key-save").addEventListener("click", function () {
    setGroqKey(document.getElementById("groq-key-input").value.trim());
    settingsModal.style.display = "none";
  });

  // ---------- REAL AI ENGINE (Groq free tier — OpenAI-compatible endpoint) ----------
  async function askNox(prompt) {
    const key = getGroqKey();
    if (!key) throw new Error("No Groq key set. Open Settings and add your free key from console.groq.com/keys.");
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({
        model: "openai/gpt-oss-120b",
        messages: [{ role: "user", content: prompt }],
        max_tokens: 400
      })
    });
    if (!res.ok) {
      const errText = await res.text().catch(function () { return res.statusText; });
      throw new Error("Groq API error " + res.status + ": " + errText.slice(0, 200));
    }
    const data = await res.json();
    return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "(empty response)";
  }

  // ---------- REAL PERSISTENT MEMORY (localStorage — free, no backend) ----------
  const MEMORY_STORAGE = "nox_memory_activity";
  let messages = [{ type: "system", text: "NOX INITIALISED. AWAITING DIRECTIVE." }];

  function loadMemory() {
    try {
      const raw = localStorage.getItem(MEMORY_STORAGE);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length) messages = parsed;
      }
    } catch (e) { /* corrupt/none — start fresh */ }
    renderActivity();
    renderMemoryLog();
  }

  function saveMemory() {
    try { localStorage.setItem(MEMORY_STORAGE, JSON.stringify(messages.slice(-40))); } catch (e) { /* storage full or blocked */ }
  }

  function renderActivity() {
    const log = document.getElementById("activity-log");
    if (!log) return;
    log.innerHTML = messages.map(function (m) {
      const div = document.createElement("div");
      div.textContent = m.text;
      return '<div class="activity-row"><div class="activity-prefix">' + (m.type === "user" ? "&gt;" : "NOX") + '</div>' +
        '<div class="activity-text">' + div.innerHTML + '</div></div>';
    }).join("");
  }

  function renderMemoryLog() {
    const el = document.getElementById("memory-log");
    if (!el) return;
    if (!messages.length) { el.textContent = "No directives yet."; return; }
    el.innerHTML = messages.slice(-10).map(function (m) {
      const div = document.createElement("div");
      div.textContent = (m.type === "user" ? "> " : "NOX: ") + m.text;
      return '<div style="margin-bottom:6px;">' + div.innerHTML + '</div>';
    }).join("");
  }

  function wireCommand() {
    const input = document.getElementById("command-input");
    const btn = document.getElementById("execute-btn");
    const label = document.getElementById("execute-label");
    const pill = document.getElementById("engine-pill");
    if (pill) {
      const hasKey = !!getGroqKey();
      pill.innerHTML = '<span class="status-dot ' + (hasKey ? "on" : "warn") + '" style="display:inline-block; margin-right:5px;"></span>' +
        '<span style="color:var(--text-3); font-size:8px; font-weight:400;">' + (hasKey ? "LIVE" : "ADD KEY IN SETTINGS") + '</span>';
    }
    renderActivity();
    if (!input || input.dataset.wired) return;
    input.dataset.wired = "1";
    async function submit() {
      const trimmed = input.value.trim();
      if (!trimmed) return;
      messages.push({ type: "user", text: trimmed });
      input.value = "";
      renderActivity();
      btn.disabled = true;
      label.textContent = "THINKING…";
      try {
        const reply = await askNox(
          "You are NOX, a personal technical intelligence system being built as a real product, not a marketing bot. " +
          "Answer the operator's directive directly and technically, in under 120 words. Never claim to have executed " +
          "code, filesystem, or network actions — you are reasoning-only right now. Directive: " + trimmed
        );
        messages.push({ type: "system", text: reply });
      } catch (e) {
        messages.push({ type: "system", text: "AI ENGINE UNAVAILABLE: " + (e && e.message ? e.message : "unknown error.") });
      }
      renderActivity();
      renderMemoryLog();
      saveMemory();
      btn.disabled = false;
      label.textContent = "EXECUTE DIRECTIVE";
    }
    btn.addEventListener("click", submit);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); } });
  }
  wireCommand();
  loadMemory();

  // ---------- BOOT SEQUENCE ----------
  const bootLines = [
    "INITIALISING NOX CORE...",
    "LOADING IDENTITY MATRIX...",
    "MOUNTING DIVISIONS: INTELLIGENCE · AGENCY · SOFTWARE · HARDWARE · CRYPTO · RESEARCH",
    "CONNECTING AI ENGINE... <span class=\"ok\">ONLINE</span>",
    "MOUNTING PERSISTENT MEMORY... <span class=\"ok\">ONLINE</span>",
    "SYSTEM READY."
  ];
  const bootEl = document.getElementById("boot-lines");
  const boot = document.getElementById("boot");
  bootLines.forEach(function (line) {
    const d = document.createElement("div");
    d.className = "line";
    d.innerHTML = line;
    bootEl.appendChild(d);
  });
  const lineEls = bootEl.querySelectorAll(".line");
  let li = 0;
  function stepBoot() {
    if (li < lineEls.length) { lineEls[li].classList.add("show"); li++; setTimeout(stepBoot, 260); }
    else { setTimeout(function () { boot.classList.add("hidden"); setTimeout(function () { boot.style.display = "none"; }, 650); }, 500); }
  }
  setTimeout(stepBoot, 300);
  boot.addEventListener("click", function () {
    boot.classList.add("hidden"); setTimeout(function () { boot.style.display = "none"; }, 650);
  });
})();
</script>
</body>
</html>
